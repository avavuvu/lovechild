<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            try {
                if (JSON.parse(localStorage.getItem('lovechild:settings') ?? '{}').theme === 'dark') {
                    document.documentElement.dataset.theme = 'dark'
                }
            } catch {}
        </script>
        %sveltekit.head%
    </head>
    <body>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
